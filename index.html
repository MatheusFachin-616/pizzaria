<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Pizzaria</title>
</head>

<body>
    <header>
        <div class="logo1">
            <img src="pizzinha.png" alt="logo" class="pizzinhaimg">
        </div>
        <div class="headeropt">
            <p class="headeroption">Home</p>
            <p class="headeroption">Cardápio</p>
            <p class="headeroption">Serviços</p>
            <p class="headeroption">Localizaçâo</p>
            <p class="headeroption">Contato</p>
        </div>
    </header>
    <main>
        <div class="meio">
            <p class="sloganp">Não é apenas uma <span style="color: orange;">Pizza</span>, é uma experiência.</p>
        </div>
        <div class="pizza">
            <img src="./pizza.png" alt="Pizza" class="pizzaimg">
        </div>
    </main>
    <footer>
        <div class="imgpizzas">
            <img src="./pizzacalabresa.png" alt="Pizza de Calabresa" class="pizzinha">
            <img src="./pizzaqueijo.png" alt="Fatia de Pizza" class="pizzinha">
            <img src="./pizzadoida.png" alt="Pizza 2" class="pizzinha">
            <img src="./pizzalouca.png" alt="Fatia de Pizza 2" class="pizzinha">
        </div>
    </footer>

</html>
